server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # SPA client-side routing: unknown paths fall back to index.html.
    # Real static files (assets, /guides/*.html, /tutorial.html) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
